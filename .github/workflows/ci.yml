name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Real TimescaleDB so the migration creates an actual hypertable and the
      # Postgres integration tests exercise the dialect the mine runs on.
      timescaledb:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: minemonitor
          POSTGRES_PASSWORD: minemonitor
          POSTGRES_DB: minemonitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minemonitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MM_DATABASE_URL: postgresql+psycopg://minemonitor:minemonitor@localhost:5432/minemonitor
      MM_TEST_DATABASE_URL: postgresql+psycopg://minemonitor:minemonitor@localhost:5432/minemonitor
      MM_MQTT_HOST: localhost
      MM_TEST_MQTT_HOST: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Start MQTT broker (Mosquitto)
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
          printf 'listener 1883\nallow_anonymous true\npersistence true\npersistence_location /tmp/\n' > /tmp/mosquitto.conf
          mosquitto -c /tmp/mosquitto.conf -d
          for i in $(seq 1 20); do
            mosquitto_pub -h localhost -t hc -m 1 && break || sleep 0.5
          done

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Dependency audit
        run: uv run pip-audit

      - name: Run migrations (creates the hypertable on real TimescaleDB)
        run: uv run alembic upgrade head

      - name: Tests (SQLite + Postgres + MQTT integration) with coverage
        run: uv run pytest -q --cov=minemonitor --cov-report=term-missing

  # Vision edge node: the NumPy/OpenCV/ONNX Runtime modules behind the optional `vision` extra.
  # Weights-free and GPU-free — YOLOX decode/NMS, frame quality and the video source are tested
  # on synthetic data; real-weights smoke tests skip unless var/models is populated.
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies (with vision extra)
        run: uv sync --frozen --extra dev --extra vision
      - name: Type check (with CV libraries present)
        run: uv run mypy src
      - name: Vision tests
        run: >-
          uv run pytest -q tests/test_vision_yolox.py tests/test_vision_pipeline.py
          tests/test_vision_units.py tests/test_vision_registry.py tests/test_vision_edge_node.py

  # Build the deployment image so a Dockerfile regression fails CI, not the mine.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t minemonitor:ci .
      - name: Build vision edge image
        run: docker build -f Dockerfile.vision -t minemonitor-vision-edge:ci .
      - name: Vision edge image imports its stack and refuses to start unconfigured
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python minemonitor-vision-edge:ci -c \
            "import cv2, onnxruntime, numpy; import minemonitor.vision.edge.node, minemonitor.vision.edge.rtsp; print('ok', cv2.__version__, onnxruntime.__version__)"
          # No MM_EDGE_* settings: must fail fast with *the* validation error, not run blind and
          # not crash for some other reason.
          if out=$(docker run --rm minemonitor-vision-edge:ci run-node 2>&1); then
            echo "run-node started without configuration"; exit 1
          fi
          echo "$out"
          grep -q "edge node misconfigured" <<<"$out"
          grep -q "MM_EDGE_SITE_ID: Field required" <<<"$out"
      - name: Broker persistence survives the move from Mosquitto 2.1 back to the pinned 2.0
        run: |
          # A box that pulled the floating `2` tag runs 2.1 and wrote its persistence file with it.
          # A message queued for the ingestor's persistent session must still arrive after the pin.
          # 2.1 is published only as -alpine tags; 2.1.2-alpine is the image `2` points to.
          docker volume create mq-downgrade
          run() { docker run -d --name "$1" -v mq-downgrade:/mosquitto/data \
            -v "$PWD/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" "$2"; sleep 2; }
          run mq21 eclipse-mosquitto:2.1.2-alpine
          docker exec mq21 mosquitto_sub -c -i ci-ingestor -q 1 -t ci/queued -E
          docker exec mq21 mosquitto_pub -q 1 -t ci/queued -m queued-on-2.1
          docker stop mq21
          run mq20 "$(docker compose config --format json | jq -r .services.mqtt.image)"
          docker logs mq20 2>&1 | grep -m1 'mosquitto version'
          docker logs mq20 2>&1 | grep -q 'mosquitto version 2.0.22 running'
          got=$(docker exec mq20 mosquitto_sub -c -i ci-ingestor -q 1 -t ci/queued -C 1 -W 10)
          echo "delivered after the downgrade: $got"
          [ "$got" = queued-on-2.1 ]
          docker rm -f mq21 mq20 && docker volume rm mq-downgrade
      - name: Deploy over a site on the previous database image, with the broker login only in .env
        run: |
          printf 'MM_MQTT_USERNAME=mm-ci\nMM_MQTT_PASSWORD=ci-broker-password\n' > .env
          printf 'MM_BOOTSTRAP_ADMIN_USER=ci-admin\nMM_BOOTSTRAP_ADMIN_PASSWORD=ci-admin-Passw0rd-long\n' >> .env
          sql() { docker compose exec -T db psql -U minemonitor -d minemonitor -tAc "$1"; }
          # An existing site: migrated on TimescaleDB 2.17.2, the image before this one, with a
          # user stored.
          printf 'services:\n  db:\n    image: timescale/timescaledb:2.17.2-pg16\n' > "$RUNNER_TEMP/previous-db.yml"
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/previous-db.yml" up -d --build db api
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break; sleep 2; done
          before=$(sql "select extversion from pg_extension where extname = 'timescaledb'")
          echo "before: timescaledb $before"
          [ "$before" = 2.17.2 ]
          # deploy.sh must move the extension to the new image's version, pick the broker login
          # up from .env, write broker files the broker can read, and fail unless the broker
          # refuses a client with no login.
          bash deploy/deploy.sh --demo
          after=$(sql "select extversion from pg_extension where extname = 'timescaledb'")
          echo "after: timescaledb $after"
          [ "$after" = 2.30.2 ]
          [ "$(sql "select count(*) from users where username = 'ci-admin'")" = 1 ]
          hypertables=$(sql "select string_agg(hypertable_name, ',' order by hypertable_name) from timescaledb_information.hypertables")
          echo "hypertables: $hypertables"
          [ "$hypertables" = asset_metrics,positions,vision_observations ]
          # The demo fleet and the ingestor log in as the service account, so stored positions
          # prove the broker accepted that login end to end.
          n=0
          for i in $(seq 1 30); do
            n=$(sql 'select count(*) from positions') || n=0
            [ "$n" -gt 0 ] && break
            sleep 2
          done
          echo "positions stored: $n"
          [ "$n" -gt 0 ]
          # The healthcheck reports the authenticated broker healthy.
          state=""
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q mqtt)")
            [ "$state" = healthy ] && break
            sleep 3
          done
          echo "mqtt health: $state"
          [ "$state" = healthy ]
      - name: Deploy on a clean box
        run: |
          docker compose --profile sim down --volumes
          bash deploy/deploy.sh
          ext=$(docker compose exec -T db psql -U minemonitor -d minemonitor -tAc "select extversion from pg_extension where extname = 'timescaledb'")
          echo "timescaledb $ext"
          [ "$ext" = 2.30.2 ]
      - name: Stack status and logs
        if: failure()
        run: docker compose --profile sim ps -a && docker compose --profile sim logs --no-color --tail 100

  # Browser end-to-end: load the real dashboard in Chromium and acknowledge an alarm.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies (with browser extra)
        run: uv sync --frozen --extra dev --extra browser
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: Dashboard smoke test
        env:
          MM_TEST_BROWSER: "1"
        run: uv run pytest tests/test_dashboard_browser.py -q
