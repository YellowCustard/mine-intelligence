# Mine Monitor — full stack. Must run entirely on one box at the mine (brief §3).
# `docker compose up` brings up the database, broker and API. Optional services (trackers,
# simulator, vision, evidence object store, TLS, backup) are compose profiles.
#
# Power and network will fail at a remote site (brief §3), so every long-running
# service restarts unless explicitly stopped, and each has a healthcheck.

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minemonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minemonitor}
      POSTGRES_DB: ${POSTGRES_DB:-minemonitor}
    ports:
      # Loopback only: the API, ingestor and backup reach the database over the compose network.
      # Docker-published ports bypass ufw, so this bind address is what keeps 5432 off the LAN.
      - "${MM_DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minemonitor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Loopback by default: every client in this stack reaches the broker over the compose
      # network. Set MM_MQTT_BIND to this host's device-VLAN address only when a device on another
      # box publishes over MQTT (a vision edge node with MM_EDGE_TRANSPORT=mqtt), and only with
      # the authenticated broker. ufw does not filter Docker-published ports.
      - "${MM_MQTT_BIND:-127.0.0.1}:1883:1883"
    volumes:
      # Default is the anonymous dev config; set MM_MOSQUITTO_CONF=./docker/mosquitto.auth.conf
      # for the hardened, authenticated broker (generate ./docker/mosquitto first with
      # `python -m minemonitor.devices.broker_config`).
      - ${MM_MOSQUITTO_CONF:-./docker/mosquitto.conf}:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto:/mosquitto/config/auth:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Evidence object store (S3 API). Opt-in, because nothing in Phase 1 writes evidence; only the
  # vision edge node does, with MM_EDGE_EVIDENCE=s3. Enable with:
  #   docker compose --profile evidence up -d
  # SeaweedFS (Apache-2.0) replaced MinIO, which is AGPL-3.0 and no longer publishes its images
  # (docs/OBJECT_STORAGE.md). Locked down: telemetry off, the Iceberg/Lance catalog ports off,
  # master/volume/filer bound to loopback inside the container so only the authenticated S3 port
  # is reachable, on its own network shared only with vision-edge. Credentials come from .env and
  # the store refuses to start without them (docker/objectstore-start.sh).
  objectstore:
    image: chrislusf/seaweedfs:4.48
    profiles: ["evidence"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mm/objectstore-start.sh", "/tmp/s3.json", "/entrypoint.sh"]
    command:
      - server
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -s3.ip.bind=0.0.0.0
      - -master.telemetry=false
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.config=/tmp/s3.json
    environment:
      MM_OBJECTSTORE_ADMIN_KEY: ${MM_OBJECTSTORE_ADMIN_KEY:-}
      MM_OBJECTSTORE_ADMIN_SECRET: ${MM_OBJECTSTORE_ADMIN_SECRET:-}
      MM_EDGE_S3_ACCESS_KEY: ${MM_EDGE_S3_ACCESS_KEY:-}
      MM_EDGE_S3_SECRET_KEY: ${MM_EDGE_S3_SECRET_KEY:-}
      MM_EDGE_S3_BUCKET: ${MM_EDGE_S3_BUCKET:-mine-evidence}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [evidence]
    ports:
      # Loopback by default. Set MM_OBJECTSTORE_BIND to the LAN address only when a vision edge
      # node on another box uploads here, and put TLS in front if that link leaves the site LAN.
      - "${MM_OBJECTSTORE_BIND:-127.0.0.1}:8333:8333"
    volumes:
      - objectstore_data:/data
      - ./docker/objectstore-start.sh:/mm/objectstore-start.sh:ro

  # One-shot: create the evidence bucket over the S3 API (idempotent; 409 = already there).
  objectstore-init:
    image: chrislusf/seaweedfs:4.48
    profiles: ["evidence"]
    restart: "no"
    depends_on:
      objectstore:
        condition: service_healthy
    networks: [evidence]
    environment:
      MM_OBJECTSTORE_ADMIN_KEY: ${MM_OBJECTSTORE_ADMIN_KEY:-}
      MM_OBJECTSTORE_ADMIN_SECRET: ${MM_OBJECTSTORE_ADMIN_SECRET:-}
      MM_EDGE_S3_BUCKET: ${MM_EDGE_S3_BUCKET:-mine-evidence}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        code=$$(curl -sS -o /dev/null -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3'
        --user "$$MM_OBJECTSTORE_ADMIN_KEY:$$MM_OBJECTSTORE_ADMIN_SECRET"
        -X PUT "http://objectstore:8333/$$MM_EDGE_S3_BUCKET");
        case "$$code" in
        200|409) echo "objectstore: bucket $$MM_EDGE_S3_BUCKET ready (HTTP $$code)";;
        *) echo "objectstore: creating bucket $$MM_EDGE_S3_BUCKET failed (HTTP $$code)" >&2; exit 1;;
        esac

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-minemonitor}:${POSTGRES_PASSWORD:-minemonitor}@db:5432/${POSTGRES_DB:-minemonitor}
      MM_MQTT_HOST: mqtt
      # Broker service account (blank = anonymous broker for dev/demo).
      MM_MQTT_USERNAME: ${MM_MQTT_USERNAME:-}
      MM_MQTT_PASSWORD: ${MM_MQTT_PASSWORD:-}
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-INFO}
      # First-run admin (M6): created only if the users table is empty. Leave
      # blank in production and create the first admin with the CLI instead.
      MM_BOOTSTRAP_ADMIN_USER: ${MM_BOOTSTRAP_ADMIN_USER:-}
      MM_BOOTSTRAP_ADMIN_PASSWORD: ${MM_BOOTSTRAP_ADMIN_PASSWORD:-}
      MM_RETAIN_POSITIONS_DAYS: ${MM_RETAIN_POSITIONS_DAYS:-90}
      MM_RETAIN_METRICS_DAYS: ${MM_RETAIN_METRICS_DAYS:-365}
      MM_RETAIN_EVENTS_DAYS: ${MM_RETAIN_EVENTS_DAYS:-365}
      MM_RETAIN_ANNOTATIONS_DAYS: ${MM_RETAIN_ANNOTATIONS_DAYS:-365}
      MM_RETAIN_AUDIT_DAYS: ${MM_RETAIN_AUDIT_DAYS:-730}
      # Auth hardening (Phase 2). Tunable per site.
      MM_LOGIN_MAX_FAILURES: ${MM_LOGIN_MAX_FAILURES:-5}
      MM_LOGIN_LOCKOUT_MINUTES: ${MM_LOGIN_LOCKOUT_MINUTES:-15}
      MM_HEARTBEAT_STALE_S: ${MM_HEARTBEAT_STALE_S:-180}
      MM_NOTIFY_MIN_SEVERITY: ${MM_NOTIFY_MIN_SEVERITY:-}
      MM_NOTIFY_WEBHOOK_URL: ${MM_NOTIFY_WEBHOOK_URL:-}
      MM_NOTIFY_SMTP_HOST: ${MM_NOTIFY_SMTP_HOST:-}
      MM_NOTIFY_SMTP_PORT: ${MM_NOTIFY_SMTP_PORT:-587}
      MM_NOTIFY_SMTP_USER: ${MM_NOTIFY_SMTP_USER:-}
      MM_NOTIFY_SMTP_PASSWORD: ${MM_NOTIFY_SMTP_PASSWORD:-}
      MM_NOTIFY_SMTP_STARTTLS: ${MM_NOTIFY_SMTP_STARTTLS:-true}
      MM_NOTIFY_EMAIL_FROM: ${MM_NOTIFY_EMAIL_FROM:-}
      MM_NOTIFY_EMAIL_TO: ${MM_NOTIFY_EMAIL_TO:-}
    volumes:
      # Shared with the broker: `python -m minemonitor.devices.broker_config` (run
      # via `docker compose exec api`) writes passwd+acl here, and the mqtt service
      # bind-mounts the same host dir read-only at /mosquitto/config/auth.
      - ./docker/mosquitto:/app/docker/mosquitto
    ports:
      # The API has auth (M6, HTTP Basic), but Basic credentials must ride TLS, so keep
      # MM_API_BIND on loopback: the bundled Caddy (--profile tls) reaches the API over the
      # compose network and a reverse proxy on this host uses 127.0.0.1:8000. A proxy on
      # another host would carry the credentials over plain HTTP to here.
      - "${MM_API_BIND:-127.0.0.1}:8000:8000"

  # MQTT ingestor: subscribes to position topics and stores them idempotently.
  ingestor:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      MM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-minemonitor}:${POSTGRES_PASSWORD:-minemonitor}@db:5432/${POSTGRES_DB:-minemonitor}
      MM_MQTT_HOST: mqtt
      MM_MQTT_USERNAME: ${MM_MQTT_USERNAME:-}
      MM_MQTT_PASSWORD: ${MM_MQTT_PASSWORD:-}
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-INFO}
      # The ingestor also runs the scheduled retention deletion job (~daily).
      MM_RETAIN_POSITIONS_DAYS: ${MM_RETAIN_POSITIONS_DAYS:-90}
      MM_RETAIN_METRICS_DAYS: ${MM_RETAIN_METRICS_DAYS:-365}
      MM_RETAIN_EVENTS_DAYS: ${MM_RETAIN_EVENTS_DAYS:-365}
      MM_RETAIN_ANNOTATIONS_DAYS: ${MM_RETAIN_ANNOTATIONS_DAYS:-365}
      MM_RETAIN_AUDIT_DAYS: ${MM_RETAIN_AUDIT_DAYS:-730}
      MM_RETENTION_INTERVAL_S: ${MM_RETENTION_INTERVAL_S:-86400}
      MM_HEARTBEAT_STALE_S: ${MM_HEARTBEAT_STALE_S:-180}
      MM_NOTIFY_MIN_SEVERITY: ${MM_NOTIFY_MIN_SEVERITY:-}
      MM_NOTIFY_WEBHOOK_URL: ${MM_NOTIFY_WEBHOOK_URL:-}
      MM_NOTIFY_SMTP_HOST: ${MM_NOTIFY_SMTP_HOST:-}
      MM_NOTIFY_SMTP_PORT: ${MM_NOTIFY_SMTP_PORT:-587}
      MM_NOTIFY_SMTP_USER: ${MM_NOTIFY_SMTP_USER:-}
      MM_NOTIFY_SMTP_PASSWORD: ${MM_NOTIFY_SMTP_PASSWORD:-}
      MM_NOTIFY_SMTP_STARTTLS: ${MM_NOTIFY_SMTP_STARTTLS:-true}
      MM_NOTIFY_EMAIL_FROM: ${MM_NOTIFY_EMAIL_FROM:-}
      MM_NOTIFY_EMAIL_TO: ${MM_NOTIFY_EMAIL_TO:-}
    entrypoint: ["uv", "run", "python", "-m", "minemonitor.ingest.mqtt"]
    healthcheck:
      # The ingestor has no HTTP endpoint; it is healthy while its heartbeat is fresh.
      test: ["CMD", "uv", "run", "python", "-m", "minemonitor.healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

  # Teltonika TCP listener (M7). Decodes Codec 8/8E from real trackers and
  # republishes into MQTT, so live data drives the same rules/cycles/alarms as the
  # simulator. Opt-in until trackers are on site:  docker compose --profile trackers up -d
  teltonika:
    build: .
    profiles: ["trackers"]
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
    environment:
      MM_MQTT_HOST: mqtt
      MM_MQTT_USERNAME: ${MM_MQTT_USERNAME:-}
      MM_MQTT_PASSWORD: ${MM_MQTT_PASSWORD:-}
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-INFO}
      MM_DEFAULT_SITE_ID: ${MM_DEFAULT_SITE_ID:-kn-zw-01}
      MM_TELTONIKA_PORT: ${MM_TELTONIKA_PORT:-5027}
    ports:
      # Trackers dial in, so this one faces the network. ufw cannot narrow it (Docker-published
      # ports bypass ufw); set MM_TELTONIKA_BIND to the host address the trackers reach.
      - "${MM_TELTONIKA_BIND:-0.0.0.0}:${MM_TELTONIKA_PORT:-5027}:${MM_TELTONIKA_PORT:-5027}"
    entrypoint: ["uv", "run", "python", "-m", "minemonitor.ingest.adapters.teltonika"]

  # Synthetic fleet. Enable with:  docker compose --profile sim up
  simulator:
    build: .
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
    environment:
      MM_MQTT_HOST: mqtt
      MM_MQTT_USERNAME: ${MM_MQTT_USERNAME:-}
      MM_MQTT_PASSWORD: ${MM_MQTT_PASSWORD:-}
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-INFO}
    entrypoint: ["uv", "run", "python", "-m", "minemonitor.ingest.adapters.simulator"]

  # First-party vision edge node (vision V5 — Stage C pilot). Opt-in, like the trackers:
  #   docker compose --profile vision up -d
  # Before enabling: fetch the pinned weights into ./var/models, provision the node's device
  # account, give each camera a scene (PUT .../cameras/{id}/scene) and list its stream in
  # MM_EDGE_STREAMS. Runbook: docs/VISION_DEPLOYMENT.md §8. It may run on this box or on a
  # separate box next to the cameras: there, set MM_EDGE_CORE_URL to the core's https:// address and
  # start only the node with  docker compose --profile vision up -d --no-deps vision-edge
  vision-edge:
    build:
      context: .
      dockerfile: Dockerfile.vision
    profiles: ["vision"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-INFO}
      MM_EDGE_SITE_ID: ${MM_EDGE_SITE_ID:-kn-zw-01}
      MM_EDGE_NODE_ID: ${MM_EDGE_NODE_ID:-edge-01}
      MM_EDGE_CORE_URL: ${MM_EDGE_CORE_URL:-http://api:8000}
      MM_EDGE_USERNAME: ${MM_EDGE_USERNAME:-}
      MM_EDGE_PASSWORD: ${MM_EDGE_PASSWORD:-}
      MM_EDGE_STREAMS: ${MM_EDGE_STREAMS:-}
      MM_EDGE_MODEL: ${MM_EDGE_MODEL:-yolox-nano}
      MM_EDGE_SAMPLE_FPS: ${MM_EDGE_SAMPLE_FPS:-5}
      MM_EDGE_CONFIG_REFRESH_S: ${MM_EDGE_CONFIG_REFRESH_S:-300}
      MM_EDGE_DRAIN_INTERVAL_S: ${MM_EDGE_DRAIN_INTERVAL_S:-5}
      MM_EDGE_HEARTBEAT_S: ${MM_EDGE_HEARTBEAT_S:-60}
      MM_EDGE_NO_SIGNAL_AFTER_S: ${MM_EDGE_NO_SIGNAL_AFTER_S:-15}
      MM_EDGE_OBSERVATION_KEEP_HOURS: ${MM_EDGE_OBSERVATION_KEEP_HOURS:-72}
      MM_EDGE_FROZEN_DIFF: ${MM_EDGE_FROZEN_DIFF:-0.5}
      MM_EDGE_FROZEN_FRAMES: ${MM_EDGE_FROZEN_FRAMES:-25}
      MM_EDGE_TRANSPORT: ${MM_EDGE_TRANSPORT:-http}
      MM_EDGE_MQTT_HOST: ${MM_EDGE_MQTT_HOST:-mqtt}
      MM_EDGE_MQTT_PORT: ${MM_EDGE_MQTT_PORT:-1883}
      MM_EDGE_MQTT_PREFIX: ${MM_EDGE_MQTT_PREFIX:-mm}
      MM_EDGE_MQTT_USERNAME: ${MM_EDGE_MQTT_USERNAME:-}
      MM_EDGE_MQTT_PASSWORD: ${MM_EDGE_MQTT_PASSWORD:-}
      MM_EDGE_EVIDENCE: ${MM_EDGE_EVIDENCE:-edge}
      MM_EDGE_EVIDENCE_MAX_ITEMS: ${MM_EDGE_EVIDENCE_MAX_ITEMS:-500}
      MM_EDGE_EVIDENCE_MAX_AGE_DAYS: ${MM_EDGE_EVIDENCE_MAX_AGE_DAYS:-7}
      MM_EDGE_S3_ENDPOINT: ${MM_EDGE_S3_ENDPOINT:-http://objectstore:8333}
      MM_EDGE_S3_BUCKET: ${MM_EDGE_S3_BUCKET:-mine-evidence}
      MM_EDGE_S3_ACCESS_KEY: ${MM_EDGE_S3_ACCESS_KEY:-}
      MM_EDGE_S3_SECRET_KEY: ${MM_EDGE_S3_SECRET_KEY:-}
      MM_EDGE_S3_REGION: ${MM_EDGE_S3_REGION:-us-east-1}
    # "evidence" is the object store's network. Without the evidence profile it is empty, and the
    # node keeps stills on its own disk (MM_EDGE_EVIDENCE=edge, the default).
    networks: [default, evidence]
    volumes:
      # Outbox, config cache and the evidence ring: survive restarts and power cuts.
      - vision_state:/var/lib/mm-edge
      # Weights are fetched (pinned SHA-256), never baked into the image or committed.
      - ./var/models:/models:ro

  # TLS reverse proxy. Enable with:  docker compose --profile tls up -d
  # Terminates HTTPS in front of the API so Basic credentials ride TLS, giving a safe
  # public/LAN URL instead of an SSH tunnel. Defaults to Caddy's internal CA for an
  # on-prem host; for a public domain, set MM_SITE_DOMAIN and switch the Caddyfile's
  # `tls internal` to `tls {$MM_TLS_EMAIL}` (Let's Encrypt). See deploy/DEPLOY.md.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      MM_SITE_DOMAIN: ${MM_SITE_DOMAIN:-localhost}
      MM_TLS_EMAIL: ${MM_TLS_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Scheduled database backup. Enable with:  docker compose --profile backup up -d
  # Dumps to ./backups on an interval and prunes old dumps. Restore with
  # deploy/restore.sh (see deploy/DEPLOY.md).
  backup:
    image: timescale/timescaledb:2.17.2-pg16
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-minemonitor}
      POSTGRES_USER: ${POSTGRES_USER:-minemonitor}
      POSTGRES_DB: ${POSTGRES_DB:-minemonitor}
      MM_BACKUP_INTERVAL_S: ${MM_BACKUP_INTERVAL_S:-86400}
      MM_BACKUP_KEEP_DAYS: ${MM_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          if pg_dump -h db -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "/backups/minemonitor_$$ts.sql.gz"; then
            echo "backup written: minemonitor_$$ts.sql.gz"
          else
            echo "backup FAILED at $$ts"
          fi
          find /backups -name 'minemonitor_*.sql.gz' -mtime "+$$MM_BACKUP_KEEP_DAYS" -delete 2>/dev/null || true
          sleep "$$MM_BACKUP_INTERVAL_S"
        done

volumes:
  db_data:
  mqtt_data:
  objectstore_data:
  caddy_data:
  caddy_config:
  vision_state:

networks:
  evidence:
