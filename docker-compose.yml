# Mine Monitor — full stack. Must run entirely on one box at the mine (brief §3).
# `docker compose up` brings up the database, broker, object store and API.

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minemonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minemonitor}
      POSTGRES_DB: ${POSTGRES_DB:-minemonitor}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minemonitor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-minemonitor}:${POSTGRES_PASSWORD:-minemonitor}@db:5432/${POSTGRES_DB:-minemonitor}
      MM_MQTT_HOST: mqtt
      MM_S3_ENDPOINT: http://minio:9000
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-INFO}
      # First-run admin (M6): created only if the users table is empty. Leave
      # blank in production and create the first admin with the CLI instead.
      MM_BOOTSTRAP_ADMIN_USER: ${MM_BOOTSTRAP_ADMIN_USER:-}
      MM_BOOTSTRAP_ADMIN_PASSWORD: ${MM_BOOTSTRAP_ADMIN_PASSWORD:-}
      MM_RETAIN_POSITIONS_DAYS: ${MM_RETAIN_POSITIONS_DAYS:-90}
      MM_RETAIN_METRICS_DAYS: ${MM_RETAIN_METRICS_DAYS:-365}
      MM_RETAIN_EVENTS_DAYS: ${MM_RETAIN_EVENTS_DAYS:-365}
    ports:
      # The API has auth (M6, HTTP Basic), but Basic credentials must ride TLS.
      # Bind localhost by default and put nginx + TLS in front; set
      # MM_API_BIND=0.0.0.0 only when that reverse proxy terminates TLS.
      - "${MM_API_BIND:-127.0.0.1}:8000:8000"

  # MQTT ingestor: subscribes to position topics and stores them idempotently.
  ingestor:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      MM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-minemonitor}:${POSTGRES_PASSWORD:-minemonitor}@db:5432/${POSTGRES_DB:-minemonitor}
      MM_MQTT_HOST: mqtt
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-INFO}
      # The ingestor also runs the scheduled retention deletion job (~daily).
      MM_RETAIN_POSITIONS_DAYS: ${MM_RETAIN_POSITIONS_DAYS:-90}
      MM_RETAIN_METRICS_DAYS: ${MM_RETAIN_METRICS_DAYS:-365}
      MM_RETAIN_EVENTS_DAYS: ${MM_RETAIN_EVENTS_DAYS:-365}
      MM_RETENTION_INTERVAL_S: ${MM_RETENTION_INTERVAL_S:-86400}
    entrypoint: ["uv", "run", "python", "-m", "minemonitor.ingest.mqtt"]

  # Synthetic fleet. Enable with:  docker compose --profile sim up
  simulator:
    build: .
    profiles: ["sim"]
    depends_on:
      mqtt:
        condition: service_started
    environment:
      MM_MQTT_HOST: mqtt
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-INFO}
    entrypoint: ["uv", "run", "python", "-m", "minemonitor.ingest.adapters.simulator"]

volumes:
  db_data:
  mqtt_data:
  minio_data:
