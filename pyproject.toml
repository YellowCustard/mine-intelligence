[project]
name = "minemonitor"
version = "0.1.0"
description = "Mine Monitor — telemetry, geofencing and alarm spine for mine operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-ulid>=2.7",
    "paho-mqtt>=2.1",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest-cov>=5.0",
]
# Browser end-to-end (the dashboard smoke test). Kept out of `dev` so the main
# test job and the deploy image stay lean; installed only where the test runs.
browser = [
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minemonitor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() in argument defaults is the intended idiom.
"src/minemonitor/api/**" = ["B008"]
"src/minemonitor/auth/deps.py" = ["B008"]
# Contract tests deliberately assert that validation rejects bad input at all.
"tests/test_contracts.py" = ["B017"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["minemonitor"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# Floor sits below the observed level (85% SQLite-only, higher in CI where the
# Postgres/MQTT integration tests run) so it gates without being brittle.
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
# Pragmatic first pass: check what is annotated, don't demand full strictness yet.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Pre-existing modules with known type gaps (SQLAlchemy Result typing, Fix/Position
# duck-typing, Literal narrowing). Grandfathered so the guardrail lands green now;
# tightened in Phase 3 of the post-Phase-1 roadmap.
[[tool.mypy.overrides]]
module = [
    "minemonitor.ingest.spool",
    "minemonitor.cycles.metrics",
    "minemonitor.cycles.recompute",
    "minemonitor.storage.repositories",
    "minemonitor.retention",
    "minemonitor.rules.evaluate",
]
ignore_errors = true
