# Mosquitto config — HARDENED (authenticated) variant for a real site.
# docker-compose.yml mounts it whenever MM_MQTT_USERNAME is set (MM_MOSQUITTO_CONF
# overrides); with no login, docker/mosquitto.conf stays anonymous for local dev/demo. Requires the generated credential files (from the devices
# table + the ingest service account):
#   docker compose exec api uv run python -m minemonitor.devices.broker_config
#   docker compose exec mqtt kill -HUP 1
listener 1883
allow_anonymous false
password_file /mosquitto/config/auth/passwd
acl_file /mosquitto/config/auth/acl
persistence true
persistence_location /mosquitto/data/
